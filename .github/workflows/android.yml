name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'tailwind.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# Only the newest commit should publish the rolling APK.
concurrency:
  group: android-debug-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          echo "sdkmanager=$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:pwa

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subtranslate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Rolling prerelease so the APK can be downloaded without a GitHub login:
      # https://github.com/fswdpranay-byte/subtranslate/releases/download/android-latest/subtranslate-debug.apk
      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk subtranslate-debug.apk

          cat > release-notes.md <<'EOF'
          Automatic **debug** APK built from the latest `main` commit.

          - Installable on any Android phone (allow "Install unknown apps").
          - Signed with a fixed debug key, so each build installs over the previous one.
          - Not accepted by Google Play. Use a signed `.aab` for the store.
          EOF

          if gh release view android-latest > /dev/null 2>&1; then
            gh release upload android-latest subtranslate-debug.apk --clobber
            gh release edit android-latest --notes-file release-notes.md
          else
            gh release create android-latest subtranslate-debug.apk \
              --prerelease --title "SubTranslate Android (debug)" \
              --notes-file release-notes.md
          fi

          echo "Published assets:"
          gh release view android-latest --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
